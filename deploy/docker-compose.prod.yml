# Production stack for ToolMint, fully isolated from anything else already
# running on this VPS: its own compose project name (prefixes every
# container/volume/network name below), its own Docker network, its own
# named volumes, and its own containers — nothing here touches another
# app's database, files, or ports.
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Postgres and Redis are deliberately NOT published to the host at all —
# only the api/web/minio containers, which nginx needs to reach, are, and
# only on 127.0.0.1 (never a public interface — nginx is the only public
# entry point; see deploy/nginx/toolmint.conf).

name: toolmint

networks:
  toolmint_net:
    name: toolmint_net

volumes:
  toolmint_postgres_data:
    name: toolmint_postgres_data
  toolmint_redis_data:
    name: toolmint_redis_data
  toolmint_minio_data:
    name: toolmint_minio_data
  # AI Repetitive Voice Remover's downloaded model weights (Whisper via
  # transformers.js, and pyannote's diarization model) — both download
  # from Hugging Face on first real use, not at image build time. Without
  # a persistent volume here, every `docker compose up --build` (i.e.
  # every deploy) would silently re-download several hundred MB to a few
  # GB on the very next scan.
  toolmint_model_cache:
    name: toolmint_model_cache

services:
  postgres:
    image: postgres:16-alpine
    container_name: toolmint-postgres
    restart: unless-stopped
    networks: [toolmint_net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - toolmint_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: toolmint-redis
    restart: unless-stopped
    networks: [toolmint_net]
    volumes:
      - toolmint_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: toolmint-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks: [toolmint_net]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      # S3 API only — nginx proxies media.toolmint.co.in here. The admin
      # console (9001) isn't published; use `docker compose exec` or an SSH
      # tunnel (`ssh -L 9001:127.0.0.1:9101 you@vps`) if you need it.
      - "127.0.0.1:9100:9000"
    volumes:
      - toolmint_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: toolmint-minio-init
    networks: [toolmint_net]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} &&
      mc mb -p local/${S3_BUCKET}
      "

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: toolmint-api
    restart: unless-stopped
    networks: [toolmint_net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Started, not healthy: the sidecar answers /health immediately but
      # pulls model weights lazily on first use, so waiting for readiness
      # would block the whole API behind a 1.5GB download.
      tts-indic:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      # Public URL, not the internal "minio:9000" hostname — this gets
      # embedded in presigned URLs the browser fetches directly, so it has
      # to be something the browser (not just this container) can reach.
      S3_ENDPOINT: https://media.toolmint.co.in
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      WEB_APP_URL: https://www.toolmint.co.in
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      # AI Repetitive Voice Remover. HUGGINGFACE_TOKEN is required for
      # speaker diarization (pyannote's models are gated on Hugging Face —
      # accept both pyannote/speaker-diarization-3.1's and
      # pyannote/segmentation-3.0's terms with the same account the token
      # belongs to, or diarization silently degrades to "speaker unknown"
      # instead of failing scans). Whisper transcription needs no token
      # (public model). Both caches point at the same persistent volume
      # so model weights survive across deploys.
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
      TRANSFORMERS_CACHE_DIR: /app/.cache/transformers
      HF_HOME: /app/.cache/huggingface
      DIARIZATION_PYTHON_BIN: /app/apps/api/python/.venv/bin/python3
      # AI Voice Over's "write a script from a prompt". Optional — left
      # unset, that one button reports itself as not configured; every
      # other voice-over feature works fine without it. Add
      # ANTHROPIC_API_KEY to deploy/.env.prod to turn it on.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Hindi voices from the Indic TTS sidecar below. Optional: left
      # unset, that provider reports itself as needing configuration and
      # the built-in voices are unaffected. Unlike the built-in MMS
      # models (CC-BY-NC), the sidecar's models are licensed for
      # commercial use.
      INDIC_TTS_URL: ${INDIC_TTS_URL:-http://tts-indic:8000}
    volumes:
      - toolmint_model_cache:/app/.cache
    ports:
      - "127.0.0.1:4100:4000"

  # Hindi text-to-speech for AI Voice Over. Separate from the api because
  # F5 is a PyTorch model the Node process cannot load, and because its
  # weights are large enough that restarting the API to update a voice
  # would be painful. Not reachable from outside the compose network.
  tts-indic:
    build:
      context: ../services/tts-indic
      dockerfile: Dockerfile
    container_name: toolmint-tts-indic
    restart: unless-stopped
    networks: [toolmint_net]
    environment:
      # CC-BY-4.0, Hindi, 24kHz native - matches VOICE_OVER_SAMPLE_RATE so
      # nothing is resampled. Swap for ai4bharat/IndicF5 (MIT, 11 Indian
      # languages) once its gated download has been accepted on the
      # HUGGINGFACE_TOKEN account.
      INDIC_TTS_MODEL: ${INDIC_TTS_MODEL:-SPRINGLab/F5-Hindi-24KHz}
      INDIC_TTS_LANGUAGE: ${INDIC_TTS_LANGUAGE:-hi}
      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
    volumes:
      # Same persistent cache as the api, so the ~1.5GB of weights is
      # pulled once and survives deploys.
      - toolmint_model_cache:/app/.cache
      # Voices are reference recordings, so they are operator data rather
      # than build artefacts - mounted, not baked in.
      - ../services/tts-indic/voices:/app/voices:ro

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.toolmint.co.in
    container_name: toolmint-web
    restart: unless-stopped
    networks: [toolmint_net]
    depends_on: [api]
    ports:
      # 3100, then 3200, both collided with other next-server processes
      # already running on this VPS for other sites — moved to 38173
      # (verified free with `ss -tlnp` before settling here) instead of
      # touching either of them.
      - "127.0.0.1:38173:3000"
