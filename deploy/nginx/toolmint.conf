# New, additive nginx config for ToolMint — doesn't touch any existing
# server block on this machine. Copy this file to nginx's sites-available,
# symlink it into sites-enabled, then run certbot to add HTTPS (below).
#
#   sudo cp deploy/nginx/toolmint.conf /etc/nginx/sites-available/toolmint.conf
#   sudo ln -s /etc/nginx/sites-available/toolmint.conf /etc/nginx/sites-enabled/toolmint.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.toolmint.co.in -d api.toolmint.co.in -d media.toolmint.co.in
#
# certbot's --nginx plugin edits these blocks in place to add the `listen 443
# ssl;` / certificate directives and an HTTP->HTTPS redirect — nothing more
# needs to change here manually.

server {
    listen 80;
    listen [::]:80;
    server_name www.toolmint.co.in toolmint.co.in;

    # Hashed build assets carry their content in the filename, so they can
    # never go stale — cache them hard. Kept as its own location so the
    # revalidation rule below cannot accidentally apply to them.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:38173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Next sends prerendered HTML with s-maxage=31536000. That HTML
        # names the current build's chunk hashes, so caching it for a year
        # means a deploy is invisible until someone forces a reload — the
        # exact symptom of "I fixed it but the site still looks broken".
        # Strip it and require revalidation; the ETag survives, so an
        # unchanged page is a cheap 304, not a re-download.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;

        proxy_pass http://127.0.0.1:38173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.toolmint.co.in;

    # Video uploads go through this endpoint (proxied to S3-compatible
    # storage server-side) — default 1M would 413 on anything but a tiny
    # clip. Matches the app's own ceiling (1GB video, see MEDIA_RULES in
    # apps/api/src/media/media.constants.ts) plus headroom for multipart
    # overhead — keep these two in sync if that limit ever changes.
    client_max_body_size 1100M;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookies (the refresh token) must reach the API unmodified.
        proxy_pass_header Set-Cookie;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name media.toolmint.co.in;

    # The API's own presigned-upload traffic to MinIO also crosses this
    # host (S3_ENDPOINT is this public URL, not the internal container
    # hostname, since it has to match what the browser can also reach) —
    # same reasoning on the size ceiling as api.toolmint.co.in above.
    client_max_body_size 550M;

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
