name: toolmint-video-editor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: toolmint
      POSTGRES_PASSWORD: toolmint
      POSTGRES_DB: toolmint_video_editor
    ports:
      - "5433:5432" # host 5433 — 5432 is taken by another local project
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolmint"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379" # host 6380 — 6379 is taken by another local project
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local/dev use. Swap for a managed
  # provider (AWS S3, Cloudflare R2, Backblaze B2, ...) in production by
  # changing S3_ENDPOINT / credentials only — the app talks to the S3 API.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: toolmint
      MINIO_ROOT_PASSWORD: toolmint123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - ./.docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 toolmint toolmint123 &&
      mc mb -p local/toolmint-media &&
      mc anonymous set download local/toolmint-media/public
      "
